name: Deploy Blazor WASM to Pages
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.111
      - run: dotnet restore PokemonFieldGuide/PokemonFieldGuide.csproj --locked-mode
      - run: dotnet publish PokemonFieldGuide/PokemonFieldGuide.csproj -c Release -o release --no-restore
      - name: Prepare GitHub Pages base path
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/$repo/\" />|" release/wwwroot/index.html
          sed -i "s|const base = \"/\";|const base = \"/$repo/\";|" release/wwwroot/service-worker.js
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: release/wwwroot
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
