name: Validate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.111
      - run: dotnet restore PokemonFieldGuide/PokemonFieldGuide.csproj --locked-mode
      - run: dotnet build PokemonFieldGuide/PokemonFieldGuide.csproj -c Release --no-restore
