name: Validate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Determine validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_checks=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! changed_paths="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"; then
              echo "Unable to compare pull request changes." >&2
              exit 1
            fi
            if grep -qvE '^(docs/|[^/]+\.md$)' <<< "$changed_paths"; then
              run_checks=true
            else
              run_checks=false
            fi
          fi
          echo "run_checks=$run_checks" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - if: steps.scope.outputs.run_checks == 'false'
        run: just check-docs
      - if: steps.scope.outputs.run_checks == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.111
      - if: steps.scope.outputs.run_checks == 'true'
        run: just check
