<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Field Guide</title>
    <base href="/" />
    <script>
        try {
            const saved = JSON.parse(localStorage.getItem('frlg-field-guide-v1'));
            document.documentElement.dataset.theme = (saved?.theme || 'Dark').toLowerCase();
            document.documentElement.dataset.game = saved?.gameId || 'frlg';
            document.documentElement.dataset.version = (saved?.version || 'FireRed').toLowerCase();
            document.documentElement.style.setProperty('--boot-accent', saved?.accent || (saved?.version === 'LeafGreen' ? '#55e06f' : '#ef4b43'));
        } catch {
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.dataset.game = 'frlg';
            document.documentElement.dataset.version = 'firered';
        }
    </script>
    <style>
        html,body{margin:0;min-height:100%;background:#f5f3ec}html[data-theme="dark"],html[data-theme="dark"] body{background:#121a18}.boot-loader{position:fixed;inset:0;display:grid;place-items:center;background:#f5f3ec;color:#182a27;font-family:system-ui,sans-serif}.boot-loader__content{display:grid;justify-items:center;gap:14px}.boot-loader__ball{width:54px;height:54px;border:3px solid currentColor;border-radius:50%;position:relative;background:linear-gradient(var(--boot-accent,#ef4b43) 0 46%,currentColor 46% 54%,#fff 54%)}.boot-loader__ball:after{content:"";position:absolute;width:13px;height:13px;left:50%;top:50%;translate:-50% -50%;border:3px solid currentColor;border-radius:50%;background:#fff}.boot-loader strong{font-size:14px;letter-spacing:.14em}.boot-loader small{font-size:10px;letter-spacing:.12em;opacity:.65}.boot-loader__bar{width:180px;height:3px;border-radius:4px;overflow:hidden;background:#d6ddd9}.boot-loader__bar:after{content:"";display:block;width:45%;height:100%;background:var(--boot-accent,#ef4b43);animation:boot-progress 1.1s ease-in-out infinite alternate}html[data-theme="dark"] .boot-loader{background:#121a18;color:#e7eee9}html[data-theme="dark"] .boot-loader__bar{background:#33413d}@keyframes boot-progress{from{translate:-100%}to{translate:225%}}@media(prefers-reduced-motion:reduce){.boot-loader__bar:after{animation:none;width:100%}}
    </style>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="PokemonFieldGuide.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <script>
        window.fieldGuide = {
            load: () => { try { return JSON.parse(localStorage.getItem('frlg-field-guide-v1')); } catch { return null; } },
            save: value => localStorage.setItem('frlg-field-guide-v1', JSON.stringify(value)),
            download: (filename, value) => {
                const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 2)], { type: 'application/json' }));
                const link = document.createElement('a');
                link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
                URL.revokeObjectURL(url);
            },
            applyAppearance: (theme, gameId, version, accent, accentSoft) => {
                const appearance = (theme || 'Dark').toLowerCase();
                document.documentElement.dataset.theme = document.body.dataset.theme = appearance;
                document.documentElement.dataset.game = document.body.dataset.game = gameId;
                document.documentElement.dataset.version = document.body.dataset.version = (version || '').toLowerCase();
                for (const element of [document.documentElement, document.body]) {
                    element.style.setProperty('--accent', accent);
                    element.style.setProperty('--accent-soft', accentSoft);
                }
            }
        };
        window.fieldMap = {
            state: new WeakMap(),
            init: el => {
                if (!el) return;
                const reveal = world => {
                    if (!world) return;
                    world.classList.remove('map-ready');
                    const image = world.querySelector(':scope > img');
                    const ready = () => world.classList.add('map-ready');
                    if (!image || image.complete) ready();
                    else image.addEventListener('load', ready, { once:true });
                };
                if (window.fieldMap.state.has(el)) { const s=window.fieldMap.state.get(el);s.world=el.querySelector('.map-world,.interior-canvas');window.fieldMap.fit(el);reveal(s.world);return; }
                const state = { x: 80, y: 50, z: 1, drag: false, world: el.querySelector('.map-world,.interior-canvas') };
                const draw = () => { state.world.style.setProperty('--marker-scale', 1/state.z);state.world.style.transform = `matrix(${state.z},0,0,${state.z},${state.x},${state.y})`; };
                const windowPointerUp = e => { if(e.pointerId===state.pointerId)endDrag(); };
                const visibilityEnd = () => { if(document.hidden)endDrag(); };
                const endDrag = () => {
                    if (!state.drag) return;
                    state.drag=false;state.suppressAreaClick=state.moved;el.classList.remove('dragging');
                    if(state.pointerId!=null&&el.hasPointerCapture?.(state.pointerId))try{el.releasePointerCapture(state.pointerId);}catch{}
                    state.pointerId=null;
                    window.removeEventListener('pointerup',windowPointerUp);window.removeEventListener('blur',endDrag);document.removeEventListener('visibilitychange',visibilityEnd);
                };
                el.addEventListener('dragstart', e => e.preventDefault());
                el.addEventListener('wheel', e => { e.preventDefault(); const old=state.z; state.z=Math.max(.05,Math.min(3,state.z*(e.deltaY<0?1.15:.87))); const r=el.getBoundingClientRect(); const px=e.clientX-r.left,py=e.clientY-r.top; state.x=px-(px-state.x)*state.z/old;state.y=py-(py-state.y)*state.z/old;draw(); }, {passive:false});
                el.addEventListener('pointerdown', e => { if(e.button!==0||e.target.closest('.map-marker'))return;e.preventDefault();state.drag=true;state.moved=false;state.pointerId=e.pointerId;state.downX=e.clientX;state.downY=e.clientY;state.sx=e.clientX-state.x;state.sy=e.clientY-state.y;el.classList.add('dragging');window.addEventListener('pointerup',windowPointerUp);window.addEventListener('blur',endDrag);document.addEventListener('visibilitychange',visibilityEnd); });
                el.addEventListener('pointermove', e => { if(!state.drag||e.pointerId!==state.pointerId)return;e.preventDefault();if(Math.hypot(e.clientX-state.downX,e.clientY-state.downY)>4&&!state.moved){state.moved=true;el.setPointerCapture(state.pointerId);}if(!state.moved)return;state.x=e.clientX-state.sx;state.y=e.clientY-state.sy;draw(); });
                el.addEventListener('pointerup', endDrag);
                el.addEventListener('pointercancel', endDrag);
                el.addEventListener('lostpointercapture', endDrag);
                el.addEventListener('click', e => { if(state.suppressAreaClick&&e.target.closest('.area-hotspot')){e.preventDefault();e.stopImmediatePropagation();}state.suppressAreaClick=false; }, true);
                window.fieldMap.state.set(el,state); window.fieldMap.fit(el); reveal(state.world);
            },
            zoom: (el, amount) => { const s=window.fieldMap.state.get(el);if(!s)return;const cx=el.clientWidth/2,cy=el.clientHeight/2,old=s.z;s.z=Math.max(.05,Math.min(3,s.z*amount));s.x=cx-(cx-s.x)*s.z/old;s.y=cy-(cy-s.y)*s.z/old;s.world.style.setProperty('--marker-scale',1/s.z);s.world.style.transform=`matrix(${s.z},0,0,${s.z},${s.x},${s.y})`; },
            fit: el => { const s=window.fieldMap.state.get(el);if(!s||!s.world)return;const interior=el.classList.contains('interior-map'),padX=interior?40:80,padY=interior?40:120;let z=Math.min((el.clientWidth-padX)/s.world.offsetWidth,(el.clientHeight-padY)/s.world.offsetHeight);if(interior)z=Math.min(3,z);s.z=z;s.fitZ=z;s.x=(el.clientWidth-s.world.offsetWidth*z)/2;s.y=(el.clientHeight-s.world.offsetHeight*z)/2+(interior?0:25);s.world.style.setProperty('--marker-scale',1/z);s.world.style.transform=`matrix(${z},0,0,${z},${s.x},${s.y})`; },
            reset: el => window.fieldMap.fit(el),
            initInterior: () => window.fieldMap.init(document.querySelector('.interior-map')),
            zoomInterior: amount => window.fieldMap.zoom(document.querySelector('.interior-map'),amount),
            fitInterior: () => window.fieldMap.fit(document.querySelector('.interior-map'))
        };
    </script>
</head>

<body>
    <script>
        document.body.dataset.theme = document.documentElement.dataset.theme;
        document.body.dataset.game = document.documentElement.dataset.game;
        document.body.dataset.version = document.documentElement.dataset.version;
        document.body.style.setProperty('--accent', document.documentElement.style.getPropertyValue('--boot-accent'));
    </script>
    <div id="app">
        <div class="boot-loader" role="status" aria-live="polite">
            <div class="boot-loader__content">
                <span class="boot-loader__ball" aria-hidden="true"></span>
                <strong>POKEMON FIELD GUIDE</strong>
                <small>LOADING GAME DATA</small>
                <span class="boot-loader__bar" aria-hidden="true"></span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
